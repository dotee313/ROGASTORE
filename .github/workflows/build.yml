name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# منع بناءين متزامنين حتى لا نحصل على 429 من Maven Central.
concurrency:
  group: apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffold
        run: |
          flutter create --org com.roga --project-name roga_store --platforms android .
          rm -rf test
      - name: Patch manifest (permissions + app name)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"\/>\n    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"\/>\n    <application/' $M
          sed -i 's/android:label="[^"]*"/android:label="روجا ستور"/' $M
      - name: Make launcher icon from logo.svg
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/logo.svg -o assets/icon.png
      - run: flutter pub get
      - run: flutter analyze
      - run: dart run flutter_launcher_icons
      - name: Build APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: roga-store-apk
          path: build/app/outputs/flutter-apk/app-release.apk
