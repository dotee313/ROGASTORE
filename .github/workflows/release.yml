name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffold
        run: |
          flutter create --org com.roga --project-name roga_store --platforms android .
          rm -rf test
      - name: Patch manifest (permissions + app name)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"\/>\n    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"\/>\n    <application/' $M
          sed -i 's/android:label="[^"]*"/android:label="روجا ستور"/' $M
      - name: Make launcher icon from logo.svg
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/logo.svg -o assets/icon.png
      - run: flutter pub get
      - run: flutter analyze
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: روجا ستور ${{ github.ref_name }}
          body: |
            تحديث المتجر. رابط التنزيل المباشر:
            https://github.com/dotee313/ROGASTORE/releases/download/${{ github.ref_name }}/app-release.apk
