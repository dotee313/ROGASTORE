name: roga_store
description: روجا ستور - متجر تطبيقاتي الخاص
publish_to: none
version: 0.4.3+7

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  dio: ^5.4.0
  open_filex: ^4.4.0
  path_provider: ^2.1.2
  flutter_svg: ^2.0.10
  installed_apps: ^2.2.1
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  file_picker: ^13.4.1

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
